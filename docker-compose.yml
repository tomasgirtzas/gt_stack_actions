x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  runner:
    image: myoung34/github-runner:ubuntu-noble
    restart: unless-stopped
    logging: *default-logging
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${REPO_URL}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_NAME: gt-runner
      LABELS: gtrunner
      RUNNER_WORKDIR: /tmp/github-runner/work
      UNSET_CONFIG_VARS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/github-runner/work:/tmp/github-runner/work